name: Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "43 7 * * 0"

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        standard: ["1993", "2000", "2002", "2008", "2019", "2023"]
    steps:
      - name: Install prerequisites
        run: "sudo apt-get install -y llvm-dev"

      - name: Setup bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: 'true'
      - name: Build everything
        run: "bazel build //... --//:standard=${{ matrix.standard }}"
      - name: Integration build
        run: "cd integration && bazel build //... --@rules_osvvm//:standard=${{ matrix.standard }}"
